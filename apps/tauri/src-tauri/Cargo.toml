[package]
name = "fumbbl40k"
version = "0.3.20"
description = "FUMBBL40k — cross-platform Blood Bowl client"
edition = "2021"

[lib]
name = "fumbbl40k_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
# Used for authenticated Config-Web and FUMBBL API calls. Media references are
# resolved only through an explicitly selected local asset pack.
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
# Open external URLs (Twitch/Discord promo links) in the system browser — the
# webview can't embed/navigate them itself in the packaged build.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "pcm", "vorbis", "wav"] }
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(windows)'.dependencies]
# Per-user HKCU .jnlp file-association writer (Settings > General button).
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
