[package]
name = "fumbbl40k"
version = "1.0.168"
description = "Super FUMBBL — cross-platform Blood Bowl client"
edition = "2021"

[lib]
name = "fumbbl40k_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The FUMBBL.COM blade's docked website (src/fumbbl_home.rs) - ships in every build (owner 10-06), so it is a DEFAULT
# feature. Needs tauri's multi-webview API, which is behind tauri's `unstable` feature. `--no-default-features` builds the
# shell without it (its commands then report "unavailable" and the blade shows the installer note).
# The Windows-only webview2-com/windows-core deps (target section below) let the pane cancel its own WebView2 JNLP
# download on timeout (tauri's on_download exposes no handle); both are already in the lock via wry.
default = ["fumbbl-home"]
fumbbl-home = ["tauri/unstable", "dep:webview2-com", "dep:windows-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-single-instance = "2"
# Used for authenticated Config-Web and FUMBBL API calls. Media references are
# resolved only through an explicitly selected local asset pack.
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
# Open external URLs (Twitch/Discord promo links) in the system browser — the
# webview can't embed/navigate them itself in the packaged build.
tauri-plugin-opener = "2"
# Owner 09-25: in-app auto-updater (signed GitHub release artifacts) + relaunch after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
# Owner 09-23: the art pack - zipped parts downloaded from the public release (via tauri-plugin-http reqwest).
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
# Owner 09-30: the app patch channel verifies app-patch.json with the updater's minisign key (already in the lock via tauri-plugin-updater).
minisign-verify = "0.2"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "pcm", "vorbis", "wav"] }
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
discord-presence = "3"

[target.'cfg(windows)'.dependencies]
# Per-user HKCU .jnlp file-association writer (Settings > General button).
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
# Windows only, and only with the `fumbbl-home` feature (see [features]). Versions match wry 0.55's.
webview2-com = { version = "0.38", optional = true }
windows-core = { version = "0.61", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Throwaway ed25519 keys to sign test manifests (app_patch.rs tests; already in the lock).
ring = "0.17"
